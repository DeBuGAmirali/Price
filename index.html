* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #020604;
    --bg2: #07120b;
    --card: #0a1710;
    --border: rgba(34,197,94,.20);
    --green: #22c55e;
    --green2: #16a34a;
    --lightgreen: #4ade80;
    --red: #ef4444;
    --gold: #f5b942;
    --text: #f5f7f6;
    --muted: #91a49a;
}

body {

    font-family: Arial, Helvetica, sans-serif;

    background:

            rgba(34,197,94,.20),
            transparent 30%

        radial-gradient(
            circle at 90% 20%,
            rgba(22,163,74,.12),
            transparent 30%

        linear-gradient(
            135deg,
            #010201,
            #061009,
            #020403
        );

    overflow-x: hidden;
}

.container {
    width: min(1180px, 100%);
    margin: auto;
    padding: 20px;
}

.logo-icon {

}

.subtitle {

    background: rgba(5,12,8,.8);

    border: 1px solid var(--border);

    color: var(--muted);

    font-size: 11px;
}
