<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iran Market</title>

<meta name="description"
content="Iran Market - USD, EUR, USDT, Gold and Coins">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#020604;
    --bg2:#07120b;
    --card:#0a1710;
    --card2:#0e2116;
    --border:rgba(34,197,94,.20);
    --green:#22c55e;
    --green2:#16a34a;
    --lightgreen:#4ade80;
    --red:#ef4444;
    --gold:#f5b942;
    --text:#f5f7f6;
    --muted:#91a49a;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(34,197,94,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(22,163,74,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #010201,
            #061009,
            #020403
        );

    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(34,197,94,.035),
            transparent
        );

    animation:bgMove 8s infinite alternate;
}

@keyframes bgMove{
    from{
        transform:translateX(-5%);
    }

    to{
        transform:translateX(5%);
    }
}

.container{
    width:min(1180px,100%);
    margin:auto;
    padding:20px;
}

/* HEADER */

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo-icon{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #064e24
        );

    border:1px solid rgba(74,222,128,.4);

    box-shadow:
        0 0 30px rgba(34,197,94,.25);

    font-size:25px;
}

h1{
    font-size:25px;
}

.subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 13px;

    border-radius:30px;

    background:rgba(5,12,8,.8);

    border:1px solid var(--border);

    color:var(--muted);

    font-size:11px;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 12px var(--green);
}

.dot.offline{
    background:var(--red);
    box-shadow:0 0 12px var(--red);
}

.settings-button{
    width:43px;
    height:43px;

    border-radius:13px;

    border:1px solid var(--border);

    background:#07120b;

    color:white;

    font-size:19px;

    cursor:pointer;

    transition:.2s;
}

.settings-button:hover{
    color:var(--lightgreen);
    border-color:var(--green);
    transform:translateY(-2px);
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.card{
    position:relative;
    overflow:hidden;

    padding:21px;

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            rgba(15,34,21,.95),
            rgba(3,9,5,.95)
        );

    border:1px solid var(--border);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);

    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);

    border-color:
        rgba(34,197,94,.45);

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 30px rgba(34,197,94,.08);
}

.card:after{
    content:"";
    position:absolute;

    width:120px;
    height:120px;

    right:-60px;
    top:-60px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(34,197,94,.15),
            transparent 70%
        );
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.asset{
    display:flex;
    align-items:center;
    gap:11px;
}

.asset-icon{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.18),
            rgba(0,0,0,.4)
        );

    font-size:21px;
}

.name{
    font-size:14px;
    font-weight:bold;
}

.code{
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

.change{
    padding:5px 8px;

    border-radius:8px;

    color:var(--lightgreen);

    background:rgba(34,197,94,.10);

    font-size:10px;
}

.change.down{
    color:#f87171;
    background:rgba(239,68,68,.10);
}

.price{
    font-size:30px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unit{
    color:var(--muted);
    font-size:10px;
    margin-top:6px;
}

.details{
    display:flex;
    justify-content:space-between;

    margin-top:18px;
    padding-top:13px;

    border-top:1px solid rgba(255,255,255,.06);

    color:var(--muted);
    font-size:10px;
}

.details strong{
    display:block;
    color:#dce8df;
    margin-top:5px;
}

/* CHART */

.chart-card{
    margin-top:18px;
    padding:22px;

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            rgba(12,29,17,.95),
            rgba(3,8,5,.95)
        );

    border:1px solid var(--border);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.chart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
